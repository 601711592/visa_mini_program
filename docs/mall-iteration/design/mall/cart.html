<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>董大象 · 购物车</title>
<link rel="stylesheet" href="shared/site.css">
<link rel="stylesheet" href="shared/commerce.css">
<script src="assets/lucide.min.js" defer>
</script>
<script src="shared/seed.js" defer>
</script>
<script src="shared/preview.js" defer>
</script>
<script src="shared/commerce.js" defer>
</script>
<script src="mall/cart.js" defer>
</script>
</head>
<body data-page="cart" data-defaults="">
<aside class="preview-tools">
<strong>购物车 · 微信小程序</strong>
<label>预览宽度 <select id="width">
<option>375</option>
<option selected>390</option>
<option>430</option>
<option>750</option>
</select>
</label>
<a href="pages.html">页面目录</a>
<button id="reset-preview">重置演示数据</button>
</aside>
<div id="stage">
<div id="screen" class="screen commerce-screen ">
<div class="sub-nav standalone-nav">
<button data-back aria-label="返回">
<i data-lucide="chevron-left">
</i>
</button>
<h2>购物车</h2>
<div class="capsule" aria-label="微信胶囊示意">
<i data-lucide="ellipsis">
</i>
<span>
</span>
<i data-lucide="circle-dot">
</i>
</div>
</div>
<main id="page-content">
<div id="visa-proto">
<div class="phone ">
<main>
<section class="panel">
<div class="row">
<label>
<input type="checkbox" data-cart="0" checked=""> 选择商品</label>
<button class="link" data-action="remove:0">删除</button>
</div>
<div class="checkout-product">
<img class="checkout-cover" src="assets/product-1.jpg" alt="美国旅游签证 · 专业办理商品封面（示例）">
<div class="checkout-product-info">
<div class="visa-heading">
<span class="tag">签证服务</span>
<h3 style="margin:8px 0 2px">美国旅游签证 · 专业办理</h3>
<small>标准办理 · 成人 · 2026-10-12 · 2 人</small>
</div>
</div>
</div>
<div class="row">
<span class="mini-price">¥1299 / 人</span>
<div class="stepper">
<button class="" data-action="cartQty:0:-1">−</button>2<button class="" data-action="cartQty:0:1">+</button>
</div>
</div>
</section>
<section class="panel">
<div class="row">
<label>
<input type="checkbox" data-cart="1" checked=""> 选择商品</label>
<button class="link" data-action="remove:1">删除</button>
</div>
<div class="checkout-product">
<img class="checkout-cover" src="assets/product-2.jpg" alt="日本单次旅游签证商品封面（示例）">
<div class="checkout-product-info">
<div class="visa-heading">
<span class="tag">签证服务</span>
<h3 style="margin:8px 0 2px">日本单次旅游签证</h3>
<small>标准办理 · 成人 · 2026-10-15 · 1 人</small>
</div>
</div>
</div>
<div class="row">
<span class="mini-price">¥699 / 人</span>
<div class="stepper">
<button class="" data-action="cartQty:1:-1">−</button>1<button class="" data-action="cartQty:1:1">+</button>
</div>
</div>
</section>
</main>
<footer>
<div class="row wrap">
<label>
<input type="checkbox" data-field="all" checked=""> 全选</label>
<div>已选 3 人</div>
<button class="primary" data-action="cartCheckout">去结算</button>
</div>
</footer>
<nav>
<button class="" data-action="go:home">
<i data-lucide="house" aria-hidden="true">
</i>首页</button>
<button class="" data-action="go:catalog">
<i data-lucide="layout-grid" aria-hidden="true">
</i>产品分类</button>
<button class="" data-action="go:mine">
<i data-lucide="user-round" aria-hidden="true">
</i>我的</button>
</nav>
</div>
</div>
</main>
<div id="page-notice" class="page-notice" role="status" hidden>
</div>
</div>
</div>
<p class="preview-note">设计预览 · 授权与支付均为模拟</p>
</body>
</html>
