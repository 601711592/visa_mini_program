<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>董大象 · 个人资料</title>
<link rel="stylesheet" href="shared/site.css">
<script src="assets/lucide.min.js" defer>
</script>
<script src="shared/seed.js" defer>
</script>
<script src="shared/preview.js" defer>
</script>
<script src="shared/components.js" defer>
</script>
<script src="account/actions.js" defer>
</script>
<script src="account/profile.js" defer>
</script>
</head>
<body data-page="profile" data-defaults="">
<aside class="preview-tools">
<strong>个人资料 · 微信小程序</strong>
<label>预览宽度 <select id="width">
<option>375</option>
<option selected>390</option>
<option>430</option>
<option>750</option>
</select>
</label>
<a href="pages.html">页面目录</a>
<button id="reset-preview">重置演示数据</button>
</aside>
<div id="stage">
<div id="screen" class="screen ">
<div class="sub-nav standalone-nav">
<button data-back aria-label="返回">
<i data-lucide="chevron-left">
</i>
</button>
<h2>个人资料</h2>
<div class="capsule" aria-label="微信胶囊示意">
<i data-lucide="ellipsis">
</i>
<span>
</span>
<i data-lucide="circle-dot">
</i>
</div>
</div>
<main id="page-content">
<div class="page-body">
<form class="sheet-card form-card" data-form="profile">
<div class="profile-edit">
<span class="avatar">
</span>
<label class="upload-label">更换头像<input type="file" accept="image/png,image/jpeg,image/webp" id="avatar-file" aria-label="选择头像">
</label>
</div>
<label>昵称（选填）<input name="nickname" value="张女士" maxlength="20" placeholder="填写昵称">
</label>
<div class="kv">
<span>手机号码</span>
<span>138****6688</span>
</div>
<p class="hint">头像、昵称自愿完善，不影响下单。</p>
<button type="submit" class="solid">保存资料</button>
</form>
<section class="sheet-card">
<button class="menu-row" data-page="terms" data-params="{&quot;kind&quot;:&quot;privacy&quot;}">
<span>隐私保护指引</span>
<i data-lucide="chevron-right" aria-hidden="true">
</i>
</button>
</section>
<button class="outline full" data-do="logout" data-id="">退出登录</button>
</div>
</main>
<div id="page-notice" class="page-notice" role="status" hidden>
</div>
</div>
</div>
<p class="preview-note">设计预览 · 授权与支付均为模拟</p>
</body>
</html>
