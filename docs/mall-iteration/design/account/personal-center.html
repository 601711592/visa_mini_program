<!doctype html>
<html lang="zh-CN">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>董大象 · 个人中心设计预览</title>
<link rel="stylesheet" href="shared/site.css">
<script src="assets/lucide.min.js" defer>
</script>
<script src="shared/seed.js" defer>
</script>
<script src="shared/preview.js" defer>
</script>
<script src="account/personal-center.js" defer>
</script>
</head>
<body data-page="mine">
<aside class="preview-tools" aria-label="设计预览工具">
<strong>个人中心 · 微信小程序</strong>
<span>750 设计稿 / #8AD0F9</span>
<label>预览宽度 <select id="width">
<option>375</option>
<option selected>390</option>
<option>430</option>
<option>750</option>
</select>
</label>
<button id="toggle">切换游客态</button>
<a href="pages.html">页面目录</a>
<a href="DESIGN-LANGUAGE.md" target="_blank">设计规范</a>
<a href="assets/personal-center-reference.png" target="_blank">原版布局参考</a>
</aside>
<div id="stage">
<div class="screen" id="screen">
<header class="hero">
<div class="mini-nav">
<h1>个人中心</h1>
<div class="capsule" aria-label="微信原生胶囊示意">
<i data-lucide="ellipsis">
</i>
<span>
</span>
<i data-lucide="circle-dot">
</i>
</div>
</div>
<button class="profile" data-route="profile">
<span class="avatar" role="img" aria-label="演示用户头像">
</span>
<span class="identity">
<strong id="name">张女士</strong>
<span id="phone">138****6688</span>
</span>
<i data-lucide="chevron-right">
</i>
</button>
</header>
<main>
<section class="card orders" aria-labelledby="orders-title">
<div class="section-title">
<h2 id="orders-title">我的订单</h2>
<button class="all" data-route="orders">查看全部<i data-lucide="chevron-right">
</i>
</button>
</div>
<div class="order-grid">
<button data-route="orders" data-filter="待付款">
<i data-lucide="wallet">
</i>
<span>待付款</span>
</button>
<button data-route="orders" data-filter="办理中">
<i data-lucide="file-clock">
</i>
<span>办理中</span>
</button>
<button data-route="orders" data-filter="已完成">
<i data-lucide="circle-check">
</i>
<span>已完成</span>
</button>
<button data-route="orders" data-filter="售后退款">
<i data-lucide="undo-2">
</i>
<span>售后退款</span>
</button>
</div>
</section>
<section class="card benefits" aria-label="我的权益">
<div class="benefit">
<button class="detail" data-route="points">
<i data-lucide="coins">
</i>
<span>
<strong>积分中心</strong>
<span class="description">
<span id="points">当前积分 1280</span>
<span class="detail-link"> · 明细<i data-lucide="chevron-right">
</i>
</span>
</span>
</span>
</button>
<button class="pill" data-route="catalog" data-auth="true">去使用</button>
</div>
<div class="benefit">
<button class="detail" data-route="coupons">
<i data-lucide="ticket-percent">
</i>
<span>
<strong>优惠券</strong>
<span class="description">
<span id="coupons">2 张可用</span>
<span class="detail-link"> · 查看全部<i data-lucide="chevron-right">
</i>
</span>
</span>
</span>
</button>
<button class="pill" data-route="coupons" data-purpose="use">去使用</button>
</div>
<div class="benefit">
<button class="detail" data-local="invite">
<i data-lucide="user-round-plus">
</i>
<span>
<strong>邀请好友</strong>
<span class="description">查看邀请记录与奖励规则</span>
</span>
</button>
<button class="pill" data-local="invite">去邀请</button>
</div>
</section>
<section class="card services" aria-label="常用服务">
<button data-route="address">
<i data-lucide="map-pin">
</i>
<span>收货地址管理</span>
<i data-lucide="chevron-right">
</i>
</button>
<button data-local="map">
<i data-lucide="map">
</i>
<span>我司地图定位</span>
<i data-lucide="chevron-right">
</i>
</button>
</section>
</main>
<nav class="tabbar" aria-label="底部导航">
<button data-route="home">
<i data-lucide="house">
</i>
<span>首页</span>
</button>
<button data-route="catalog">
<i data-lucide="layout-grid">
</i>
<span>产品分类</span>
</button>
<button class="active" aria-current="page">
<i data-lucide="user-round">
</i>
<span>我的</span>
</button>
</nav>
</div>
</div>
<p class="preview-note">设计预览 · 数据为模拟</p>
</body>
</html>
